name: Agent workflow checks

on:
  push:
    branches: [main]
    paths:
      - "GOALS.md"
      - "AUTOMATION.md"
      - "README.md"
      - ".github/CODEOWNERS"
      - ".github/copilot-instructions.md"
      - ".github/workflows/**"
      - ".github/aw/**"
      - ".gitattributes"
      - "tools/**"
      - ".nvmrc"
  pull_request:
    branches: [main]
    paths:
      - "GOALS.md"
      - "AUTOMATION.md"
      - "README.md"
      - ".github/CODEOWNERS"
      - ".github/copilot-instructions.md"
      - ".github/workflows/**"
      - ".github/aw/**"
      - ".gitattributes"
      - "tools/**"
      - ".nvmrc"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned workflow compiler
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/github/gh-aw/32ecafbc061c9af57e9361942099e381102ae304/install-gh-aw.sh \
            --output "$RUNNER_TEMP/install-gh-aw.sh"
          bash "$RUNNER_TEMP/install-gh-aw.sh" v0.93.5
      - name: Validate and compile agent workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh aw compile backlog-assessment discussion-draft --strict --no-check-update --no-logo
          --action-tag 32ecafbc061c9af57e9361942099e381102ae304
      - name: Check generated files are current
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- .github .gitattributes)" ]]; then
            git status --short --untracked-files=all -- .github .gitattributes
            git --no-pager diff -- .github .gitattributes
            echo "::error::Recompile with gh-aw v0.93.5 and commit the generated workflow and .github/aw/actions-lock.json."
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Test the automation pilot contracts
        working-directory: tools
        run: |
          npm ci --ignore-scripts
          npm test
